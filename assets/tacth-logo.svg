<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 72" fill="none">
  <!-- Clean typographic wordmark TAct H.
       Uses currentColor so it picks up the theme foreground (ivory or dark). -->
  <g fill="currentColor"
     font-family="'Fraunces','Times New Roman',serif"
     font-weight="700" font-style="italic" letter-spacing="-1">
    <text x="6" y="54" font-size="58">T</text>
    <text x="42" y="54" font-size="58">A</text>
    <text x="92" y="54" font-size="36" font-weight="600">ct</text>
    <text x="148" y="54" font-size="58">H</text>
    <circle cx="212" cy="50" r="3.2"/>
  </g>
</svg>
