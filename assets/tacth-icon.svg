<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 210" fill="currentColor">
  <!-- Icône TAct H : glyphe géométrique entrelacé.
       Vectorisation fidèle (approximative) de l'icône fournie,
       en currentColor pour contraster avec n'importe quel fond. -->
  <g>
    <!-- Anneau haut-gauche (O ouvert) -->
    <circle cx="64" cy="58" r="42" fill="none" stroke="currentColor" stroke-width="14"/>
    <!-- Bloc haut-droit avec coin triangulaire -->
    <path d="M132 4 H210 V82 H168 Z"/>
    <path d="M132 4 L210 4 L168 46 Z" fill="#FFFFFF"/>
    <!-- Diagonale tranchant le bloc haut-droit -->
    <line x1="210" y1="4" x2="120" y2="110" stroke="currentColor" stroke-width="12"/>
    <!-- Croisement X central -->
    <line x1="36"  y1="82"  x2="206" y2="190" stroke="currentColor" stroke-width="12"/>
    <line x1="196" y1="78"  x2="58"  y2="198" stroke="currentColor" stroke-width="12"/>
    <!-- Roue bas-gauche avec rayon diagonal -->
    <circle cx="58" cy="152" r="42" fill="none" stroke="currentColor" stroke-width="12"/>
    <line x1="22" y1="184" x2="94" y2="118" stroke="currentColor" stroke-width="12"/>
    <circle cx="58" cy="152" r="6"/>
    <!-- Roue bas-droit (petite) -->
    <circle cx="170" cy="175" r="24" fill="none" stroke="currentColor" stroke-width="10"/>
    <circle cx="170" cy="175" r="4"/>
  </g>
</svg>
