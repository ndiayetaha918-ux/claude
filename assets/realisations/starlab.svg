<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" fill="none">
  <!-- Faithful vectorization of Starlab logotype:
       planet with slanted ring + small sparkle star, followed by STARLAB wordmark.
       Uses currentColor for foreground so it can be re-tinted per background. -->
  <g fill="currentColor">

    <!-- Planet body -->
    <circle cx="120" cy="122" r="52"/>

    <!-- Ring (drawn as two overlapping arcs to simulate pass-behind) -->
    <!-- Back half of ring -->
    <path d="M54 100
             C38 118 42 136 66 144
             C90 152 126 148 158 136
             C190 124 214 108 218 94
             C222 82 206 78 186 84"
          fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="round"/>
    <!-- Planet body again to cover the ring pass-through (re-cover center) -->
    <circle cx="120" cy="122" r="52"/>
    <!-- Front half of ring -->
    <path d="M186 84
             C206 78 222 82 218 94
             C214 108 190 124 158 136
             C126 148 90 152 66 144"
          fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="round"
          stroke-dasharray="0 62 999"/>

    <!-- Shine / small sparkle star (4-point) -->
    <path d="M208 48
             L214 66
             L232 72
             L214 78
             L208 96
             L202 78
             L184 72
             L202 66 Z"/>

  </g>

  <!-- Wordmark STARLAB -->
  <g fill="currentColor" font-family="'Impact','Arial Narrow',sans-serif"
     font-weight="900" font-size="150" letter-spacing="-4">
    <text x="270" y="170">STARLAB</text>
  </g>
</svg>
