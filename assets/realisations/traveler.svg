<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" fill="none">
  <!-- Faithful vectorization of the Traveler logotype:
       front-view propeller airplane with landing gear, wordmark TRAVELER under it.
       Uses currentColor so it can be re-tinted per background. -->
  <g fill="currentColor">

    <!-- Propeller blades (vertical) -->
    <path d="M255 40
             C248 40 244 48 244 58
             L244 96
             C244 112 252 122 260 122
             C268 122 276 112 276 96
             L276 58
             C276 48 272 40 265 40 Z" opacity=".95"/>
    <path d="M254 205
             C248 205 244 215 244 226
             L244 260
             C244 274 252 284 260 284
             C268 284 276 274 276 260
             L276 226
             C276 215 272 205 265 205 Z" opacity=".95"/>

    <!-- Propeller hub + spinner -->
    <circle cx="260" cy="163" r="18"/>
    <circle cx="260" cy="163" r="6" fill="#000" opacity=".25"/>

    <!-- Engine cowling / nose -->
    <path d="M228 128
             C228 110 238 98 260 98
             C282 98 292 110 292 128
             L292 200
             C292 218 282 230 260 230
             C238 230 228 218 228 200 Z"/>

    <!-- Cockpit / canopy -->
    <path d="M292 130
             L356 138
             L366 152
             L366 210
             L356 222
             L292 220 Z"/>
    <!-- Cockpit window (cut) -->
    <path d="M304 150 L348 156 L354 168 L354 200 L348 210 L304 208 Z" fill="#000" opacity=".18"/>

    <!-- Fuselage body tail -->
    <path d="M366 168
             L486 182
             L496 188
             L496 198
             L486 204
             L366 202 Z"/>

    <!-- Left wing (behind engine) -->
    <path d="M120 184
             L228 170
             L228 210
             L120 204
             L108 196 Z"/>

    <!-- Right wing extending -->
    <path d="M292 178
             L430 186
             L430 206
             L292 214 Z" opacity=".9"/>

    <!-- Tail fin -->
    <path d="M454 158
             L488 172
             L494 186
             L478 186
             L460 176 Z"/>

    <!-- Landing gear left -->
    <path d="M220 232
             L202 296
             L188 296
             L208 228 Z"/>
    <circle cx="195" cy="308" r="22"/>
    <circle cx="195" cy="308" r="9" fill="#000" opacity=".25"/>

    <!-- Landing gear right -->
    <path d="M298 232
             L316 296
             L330 296
             L310 228 Z"/>
    <circle cx="325" cy="308" r="22"/>
    <circle cx="325" cy="308" r="9" fill="#000" opacity=".25"/>

  </g>

  <!-- Wordmark TRAVELER -->
  <g fill="currentColor" font-family="'Arial Black','Helvetica',sans-serif"
     font-weight="900" font-style="italic" font-size="68" letter-spacing="2">
    <text x="260" y="406" text-anchor="middle">TRAVELER</text>
  </g>
</svg>
