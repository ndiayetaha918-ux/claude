<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 440" fill="none">
  <!-- White-on-transparent faithful vectorization of ISS emblem:
       magnifying glass containing a stylized eye, with a V/marker dropping below.  -->
  <g stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Magnifying glass circle -->
    <circle cx="180" cy="150" r="118" stroke-width="18"/>
    <!-- Handle of the magnifier -->
    <line x1="265" y1="235" x2="305" y2="278" stroke-width="22"/>
    <!-- Upper eyelid arc -->
    <path d="M84 128 Q180 106 276 128" stroke-width="10"/>
  </g>
  <!-- Iris (white ring) -->
  <circle cx="180" cy="168" r="40" fill="currentColor"/>
  <circle cx="180" cy="168" r="24" fill="#000"/>
  <!-- Pupil (small white) -->
  <circle cx="180" cy="168" r="5" fill="currentColor"/>
  <!-- V pin / marker pointing down from the circle -->
  <path d="M118 258 L180 420 L242 258"
        stroke="currentColor" stroke-width="18"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
