<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <defs>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1F8F3F"/>
      <stop offset="1" stop-color="#0E5A22"/>
    </linearGradient>
    <linearGradient id="yellow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4CB3A"/>
      <stop offset="1" stop-color="#A37C13"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D43641"/>
      <stop offset="1" stop-color="#7A1A1F"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6E2DC9"/>
      <stop offset="1" stop-color="#3C0C8A"/>
    </linearGradient>
  </defs>
  <!-- Outer white ring with text -->
  <circle cx="300" cy="300" r="290" fill="#FFFFFF" stroke="#0E1216" stroke-width="2"/>
  <!-- Tricolore arcs -->
  <path d="M300 30 A270 270 0 0 0 30 300 L70 300 A230 230 0 0 1 300 70 Z" fill="url(#green)"/>
  <path d="M300 30 A270 270 0 0 1 570 300 L530 300 A230 230 0 0 0 300 70 Z" fill="url(#red)"/>
  <path d="M30 300 A270 270 0 0 0 300 570 L300 530 A230 230 0 0 1 70 300 Z" fill="url(#yellow)" transform="rotate(180 300 300)"/>
  <path d="M30 300 A270 270 0 0 1 300 30 L300 70 A230 230 0 0 0 70 300 Z" fill="url(#yellow)"/>
  <path d="M300 570 A270 270 0 0 0 570 300 L530 300 A230 230 0 0 1 300 530 Z" fill="url(#green)"/>
  <path d="M300 570 A270 270 0 0 1 30 300 L70 300 A230 230 0 0 0 300 530 Z" fill="url(#red)"/>
  <!-- Inner black disc -->
  <circle cx="300" cy="300" r="200" fill="#0A0C10"/>
  <!-- Curved top text -->
  <defs>
    <path id="topArc" d="M60 300 A240 240 0 0 1 540 300"/>
    <path id="bottomArc" d="M70 300 A230 230 0 0 0 530 300"/>
  </defs>
  <text font-family="'Inter','Helvetica',sans-serif" font-weight="800" font-size="34" fill="#0A0C10" letter-spacing="4">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">INSPECTION DES SERVICES</textPath>
  </text>
  <text font-family="'Inter','Helvetica',sans-serif" font-weight="800" font-size="34" fill="#0A0C10" letter-spacing="4">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">DE SÉCURITÉ</textPath>
  </text>
  <!-- Stars top + bottom -->
  <polygon points="300,40 306,58 324,58 309,68 315,86 300,75 285,86 291,68 276,58 294,58" fill="url(#green)"/>
  <polygon points="300,560 306,542 324,542 309,532 315,514 300,525 285,514 291,532 276,542 294,542" fill="url(#green)"/>
  <!-- Contrôle / Performance / Éthique -->
  <text x="300" y="160" text-anchor="middle" font-family="'Inter',sans-serif" font-weight="500" font-size="22" fill="#FFFFFF">contrôle</text>
  <g transform="translate(120 380) rotate(-60)">
    <text font-family="'Inter',sans-serif" font-weight="500" font-size="22" fill="#FFFFFF">performance</text>
  </g>
  <g transform="translate(420 320) rotate(60)">
    <text font-family="'Inter',sans-serif" font-weight="500" font-size="22" fill="#FFFFFF">éthique</text>
  </g>
  <!-- Central abstract figure: circle head + V shape -->
  <g transform="translate(300 320)">
    <circle cx="0" cy="-60" r="22" fill="url(#purple)"/>
    <rect x="-8" y="-40" width="16" height="40" fill="url(#purple)"/>
    <path d="M-70 -10 L0 90 L70 -10 L40 -10 L0 50 L-40 -10 Z" fill="url(#purple)" stroke="#FFFFFF" stroke-width="2"/>
  </g>
  <!-- Side flag dots -->
  <g transform="translate(40 300)">
    <circle r="14" fill="#1F8F3F"/>
    <circle cx="0" cy="0" r="14" fill="url(#yellow)" clip-path="inset(0 0 0 50%)"/>
  </g>
  <g transform="translate(560 300)">
    <circle r="14" fill="#1F8F3F"/>
    <circle cx="0" cy="0" r="14" fill="url(#red)" clip-path="inset(0 0 0 50%)"/>
  </g>
</svg>
