<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 720" fill="none">
  <defs>
    <linearGradient id="aBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#1B1F27"/>
      <stop offset="1"   stop-color="#0A0C12"/>
    </linearGradient>
    <linearGradient id="aGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#FFE8A8"/>
      <stop offset="0.55" stop-color="#D8A73E"/>
      <stop offset="1"   stop-color="#8A6116"/>
    </linearGradient>
    <linearGradient id="aSilver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#F4F6F8"/>
      <stop offset="0.5" stop-color="#B8BEC5"/>
      <stop offset="1"   stop-color="#6E737A"/>
    </linearGradient>
    <linearGradient id="aGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1F7A3A"/><stop offset="1" stop-color="#0E4A22"/>
    </linearGradient>
    <linearGradient id="aYellow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F1C24A"/><stop offset="1" stop-color="#A57718"/>
    </linearGradient>
    <linearGradient id="aRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C4313A"/><stop offset="1" stop-color="#7A1A20"/>
    </linearGradient>
    <radialGradient id="aGlow" cx="0.5" cy="0.28" r="0.8">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".14"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Shield -->
  <path d="M300 40 L520 95 L520 450 C520 585 412 665 300 698 C188 665 80 585 80 450 L80 95 Z"
        fill="url(#aBody)" stroke="url(#aGold)" stroke-width="5"/>
  <path d="M300 40 L520 95 L520 450 C520 585 412 665 300 698 C188 665 80 585 80 450 L80 95 Z"
        fill="url(#aGlow)"/>

  <!-- Top star -->
  <g transform="translate(300 120)">
    <polygon points="0,-34 10,-10 36,-10 15,6 22,32 0,17 -22,32 -15,6 -36,-10 -10,-10"
             fill="url(#aGold)"/>
  </g>

  <!-- Wordmark -->
  <g>
    <text x="300" y="200" text-anchor="middle"
          font-family="'Cinzel','Trajan Pro',serif" font-weight="800" font-size="40"
          fill="url(#aSilver)" letter-spacing="10">ARMÉE</text>
    <text x="300" y="244" text-anchor="middle"
          font-family="'Cinzel','Trajan Pro',serif" font-weight="800" font-size="40"
          fill="url(#aSilver)" letter-spacing="10">DE L'AIR</text>
    <line x1="220" y1="260" x2="380" y2="260" stroke="url(#aGold)" stroke-width="1.5"/>
    <text x="300" y="282" text-anchor="middle"
          font-family="'Cinzel','Trajan Pro',serif" font-weight="600" font-size="14"
          fill="url(#aGold)" letter-spacing="8">RÉPUBLIQUE DU SÉNÉGAL</text>
  </g>

  <!-- Jet silhouette, centered -->
  <g transform="translate(300 440)" fill="url(#aSilver)" stroke="#1C1F25" stroke-width="1">
    <!-- fuselage -->
    <path d="M0,-130 L14,-90 L20,-30 L28,32 L22,86 L-22,86 L-28,32 L-20,-30 L-14,-90 Z"/>
    <!-- main wings -->
    <path d="M-20,-20 L-170,46 L-160,58 L-20,12 Z"/>
    <path d="M20,-20 L170,46 L160,58 L20,12 Z"/>
    <!-- tail fins -->
    <path d="M-22,60 L-56,94 L-28,94 L-10,74 Z"/>
    <path d="M22,60 L56,94 L28,94 L10,74 Z"/>
    <!-- canopy -->
    <ellipse cx="0" cy="-56" rx="7" ry="20" fill="#0C1014"/>
    <!-- nose highlight -->
    <path d="M-3,-126 L3,-126 L1,-110 L-1,-110 Z" fill="#FFFFFF" opacity=".6"/>
  </g>

  <!-- Wing cocarde (Sénégal flag) -->
  <g transform="translate(300 440)">
    <circle cx="0" cy="30" r="14" fill="url(#aGold)"/>
    <rect x="-12" y="20" width="8"  height="20" fill="url(#aGreen)"/>
    <rect x="-4"  y="20" width="8"  height="20" fill="url(#aYellow)"/>
    <rect x="4"   y="20" width="8"  height="20" fill="url(#aRed)"/>
    <circle cx="0" cy="30" r="14" fill="none" stroke="url(#aGold)" stroke-width="1.6"/>
    <polygon points="0,25 1.4,29 5.6,29 2.2,31.6 3.6,35.6 0,33.2 -3.6,35.6 -2.2,31.6 -5.6,29 -1.4,29"
             fill="#1F7A3A"/>
  </g>

  <!-- Side laurels (minimal) -->
  <g transform="translate(140 430)" fill="url(#aGold)" opacity=".85">
    <path d="M0,0  C12,-6 28,-4 40,6  C26,8 14,6 4,14 Z"/>
    <path d="M6,22 C18,16 34,18 46,28 C32,30 20,28 10,36 Z"/>
    <path d="M12,46 C24,40 40,42 52,52 C38,54 26,52 16,60 Z"/>
  </g>
  <g transform="translate(460 430) scale(-1 1)" fill="url(#aGold)" opacity=".85">
    <path d="M0,0  C12,-6 28,-4 40,6  C26,8 14,6 4,14 Z"/>
    <path d="M6,22 C18,16 34,18 46,28 C32,30 20,28 10,36 Z"/>
    <path d="M12,46 C24,40 40,42 52,52 C38,54 26,52 16,60 Z"/>
  </g>

  <!-- Flag stripes bottom -->
  <g transform="translate(0 590)">
    <path d="M130 0 L470 0 L452 24 L148 24 Z" fill="url(#aGreen)"/>
    <path d="M148 28 L452 28 L436 52 L164 52 Z" fill="url(#aYellow)"/>
    <path d="M164 56 L436 56 L420 80 L180 80 Z" fill="url(#aRed)"/>
  </g>

  <!-- Center badge with motto ribbon -->
  <g transform="translate(300 688)">
    <path d="M-90,0 L90,0 L78,22 L-78,22 Z" fill="url(#aGold)" stroke="#5C3F0E" stroke-width="1"/>
    <text x="0" y="16" text-anchor="middle"
          font-family="'Cinzel','Trajan Pro',serif" font-weight="700" font-size="12"
          fill="#2A1E08" letter-spacing="4">HONNEUR · COURAGE · CIEL</text>
  </g>
</svg>
