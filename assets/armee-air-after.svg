<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 720" fill="none">
  <defs>
    <linearGradient id="darkBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B3F45"/>
      <stop offset="0.5" stop-color="#1F2227"/>
      <stop offset="1" stop-color="#0D0F12"/>
    </linearGradient>
    <linearGradient id="goldNew" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE7A2"/>
      <stop offset="0.5" stop-color="#D7A53A"/>
      <stop offset="1" stop-color="#8A6116"/>
    </linearGradient>
    <linearGradient id="redPanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C4313A"/>
      <stop offset="1" stop-color="#7A1A20"/>
    </linearGradient>
    <linearGradient id="yellowPanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F1C24A"/>
      <stop offset="1" stop-color="#A57718"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F6F8"/>
      <stop offset="0.5" stop-color="#B7BDC4"/>
      <stop offset="1" stop-color="#6E737A"/>
    </linearGradient>
    <linearGradient id="greenStripe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1F7A3A"/>
      <stop offset="1" stop-color="#0E4A22"/>
    </linearGradient>
    <radialGradient id="shieldGlow" cx="0.5" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Outer shield -->
  <path d="M300 30 L520 90 L520 460 C520 590 410 670 300 700 C190 670 80 590 80 460 L80 90 Z"
        fill="url(#darkBody)" stroke="url(#goldNew)" stroke-width="6"/>
  <path d="M300 30 L520 90 L520 460 C520 590 410 670 300 700 C190 670 80 590 80 460 L80 90 Z"
        fill="url(#shieldGlow)"/>
  <!-- Top label -->
  <text x="300" y="130" text-anchor="middle"
        font-family="'Cinzel','Trajan Pro',serif" font-weight="800" font-size="46"
        fill="url(#silver)" letter-spacing="4">ARMÉE</text>
  <text x="300" y="180" text-anchor="middle"
        font-family="'Cinzel','Trajan Pro',serif" font-weight="800" font-size="46"
        fill="url(#silver)" letter-spacing="4">DE L'AIR</text>
  <!-- Two heraldic panels -->
  <g transform="translate(120 220)">
    <path d="M0 0 L160 0 L170 90 L0 90 Z" fill="url(#redPanel)" stroke="url(#goldNew)" stroke-width="3"/>
    <!-- Lion silhouette -->
    <path d="M30 70 C40 50 55 40 70 38 C68 30 75 22 85 25 C90 18 100 18 105 25 C115 24 122 32 120 42 C135 42 145 55 140 70 Z"
          fill="url(#silver)"/>
  </g>
  <g transform="translate(310 220)">
    <path d="M0 0 L160 0 L160 90 L-10 90 Z" fill="url(#yellowPanel)" stroke="url(#goldNew)" stroke-width="3"/>
    <!-- Baobab silhouette -->
    <g transform="translate(80 50)" fill="#5D3A1E">
      <rect x="-6" y="0" width="12" height="38"/>
      <ellipse cx="0" cy="-4" rx="34" ry="14"/>
      <ellipse cx="-12" cy="-12" rx="14" ry="8"/>
      <ellipse cx="12" cy="-12" rx="14" ry="8"/>
    </g>
  </g>
  <!-- Jet -->
  <g transform="translate(300 470)" fill="url(#silver)" stroke="#2A2D32" stroke-width="1">
    <!-- nose + body -->
    <path d="M0,-160 L18,-110 L24,-40 L34,30 L26,90 L-26,90 L-34,30 L-24,-40 L-18,-110 Z"/>
    <!-- wings -->
    <path d="M-24,-30 L-160,40 L-150,55 L-24,5 Z"/>
    <path d="M24,-30 L160,40 L150,55 L24,5 Z"/>
    <!-- tail fins -->
    <path d="M-26,60 L-60,95 L-30,95 L-12,75 Z"/>
    <path d="M26,60 L60,95 L30,95 L12,75 Z"/>
    <!-- cockpit -->
    <ellipse cx="0" cy="-70" rx="8" ry="22" fill="#0E1216"/>
  </g>
  <!-- Missiles with flag tips -->
  <g transform="translate(120 460)">
    <rect x="0" y="0" width="60" height="10" fill="url(#silver)"/>
    <polygon points="60,0 80,5 60,10" fill="url(#silver)"/>
    <rect x="40" y="-2" width="14" height="14" fill="#1F7A3A"/>
    <rect x="54" y="-2" width="14" height="14" fill="#F1C24A"/>
    <rect x="68" y="-2" width="14" height="14" fill="#C4313A"/>
  </g>
  <g transform="translate(420 460)">
    <rect x="0" y="0" width="60" height="10" fill="url(#silver)"/>
    <polygon points="0,0 -20,5 0,10" fill="url(#silver)"/>
    <rect x="6" y="-2" width="14" height="14" fill="#1F7A3A"/>
    <rect x="20" y="-2" width="14" height="14" fill="#F1C24A"/>
    <rect x="34" y="-2" width="14" height="14" fill="#C4313A"/>
  </g>
  <!-- Bottom diagonal stripes -->
  <g transform="translate(0 600)">
    <path d="M120 0 L520 0 L500 25 L100 25 Z" fill="url(#greenStripe)"/>
    <path d="M130 30 L520 30 L500 55 L110 55 Z" fill="url(#yellowPanel)"/>
    <path d="M140 60 L520 60 L500 85 L120 85 Z" fill="url(#redPanel)"/>
  </g>
  <!-- Centre badge -->
  <g transform="translate(300 690)">
    <path d="M-26,-10 L26,-10 L18,32 L0,42 L-18,32 Z" fill="url(#goldNew)" stroke="#5C3F0E" stroke-width="1"/>
    <polygon points="0,-2 4,8 14,8 6,14 9,24 0,18 -9,24 -6,14 -14,8 -4,8" fill="#1F7A3A"/>
  </g>
</svg>
