<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 900" fill="none">
  <defs>
    <linearGradient id="aBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#3A3F48"/>
      <stop offset="0.4"  stop-color="#242830"/>
      <stop offset="1"    stop-color="#0F1218"/>
    </linearGradient>
    <linearGradient id="aGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#F6DD9C"/>
      <stop offset="0.35" stop-color="#D7A844"/>
      <stop offset="0.7"  stop-color="#A87A22"/>
      <stop offset="1"    stop-color="#6B4A10"/>
    </linearGradient>
    <linearGradient id="aSilver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#F4F6F9"/>
      <stop offset="0.5"  stop-color="#B9BFC7"/>
      <stop offset="1"    stop-color="#6C7179"/>
    </linearGradient>
    <linearGradient id="aSilverCold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#E7EBEF"/>
      <stop offset="0.5"  stop-color="#9FA6AE"/>
      <stop offset="1"    stop-color="#4E535A"/>
    </linearGradient>
    <linearGradient id="aRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D23A42"/>
      <stop offset="1" stop-color="#7E1D24"/>
    </linearGradient>
    <linearGradient id="aYellow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F1C24A"/>
      <stop offset="1" stop-color="#A57718"/>
    </linearGradient>
    <linearGradient id="aGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1F7A3A"/>
      <stop offset="1" stop-color="#0E4A22"/>
    </linearGradient>
    <linearGradient id="aBronze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C48E4C"/>
      <stop offset="1" stop-color="#5C3813"/>
    </linearGradient>
    <radialGradient id="aGlow" cx="0.5" cy="0.25" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Outer gold frame -->
  <path d="M120 40 L580 40 L620 90 L620 540 C620 690 500 800 350 860 C200 800 80 690 80 540 L80 90 Z"
        fill="url(#aGold)"/>
  <!-- Dark shield body -->
  <path d="M128 58 L572 58 L604 100 L604 538 C604 678 492 780 350 840 C208 780 96 678 96 538 L96 100 Z"
        fill="url(#aBody)"/>
  <path d="M128 58 L572 58 L604 100 L604 538 C604 678 492 780 350 840 C208 780 96 678 96 538 L96 100 Z"
        fill="url(#aGlow)"/>
  <!-- Inner fine rule -->
  <path d="M140 72 L560 72 L590 110 L590 536 C590 672 486 764 350 822 C214 764 110 672 110 536 L110 110 Z"
        fill="none" stroke="url(#aGold)" stroke-width="1.6" opacity=".65"/>

  <!-- ARMÉE / DE L'AIR (chrome, bold) -->
  <text x="350" y="180" text-anchor="middle"
        font-family="'Cinzel','Trajan Pro',serif" font-weight="900" font-size="62"
        fill="url(#aSilver)" letter-spacing="6"
        stroke="#20242B" stroke-width="1.2">ARMÉE</text>
  <text x="350" y="246" text-anchor="middle"
        font-family="'Cinzel','Trajan Pro',serif" font-weight="900" font-size="62"
        fill="url(#aSilver)" letter-spacing="6"
        stroke="#20242B" stroke-width="1.2">DE L'AIR</text>

  <!-- LEFT PANEL : red, lion rampant -->
  <g transform="translate(128 296)">
    <path d="M0 0 L200 0 L212 120 L0 120 Z" fill="url(#aRed)"
          stroke="url(#aGold)" stroke-width="3"/>
    <!-- Lion rampant (stylized, silver) -->
    <g transform="translate(100 60)" fill="url(#aSilverCold)" stroke="#2A2D32" stroke-width="1">
      <!-- body -->
      <path d="M-34,30
               C-44,18 -46,4 -40,-8
               C-34,-18 -22,-24 -14,-20
               C-8,-18 -6,-14 -6,-10
               L-6,-34
               C-6,-42 -2,-48 4,-48
               C12,-48 16,-40 16,-32
               C16,-22 18,-14 22,-8
               C30,-4 36,4 36,14
               C36,24 26,32 16,32
               C8,32 4,30 0,26
               L0,30 Z"/>
      <!-- head -->
      <path d="M-2,-50 C6,-58 16,-58 22,-52 L20,-42 L-2,-42 Z"/>
      <!-- tail -->
      <path d="M24,-10 C36,-22 42,-8 36,6 C34,12 30,10 28,4 Z"/>
      <!-- back paws -->
      <path d="M-38,30 L-40,44 L-32,44 L-30,34 Z"/>
      <path d="M-4,30 L-2,44 L6,44 L4,34 Z"/>
      <!-- front paws raised -->
      <path d="M-10,-26 L-22,-18 L-22,-10 L-12,-16 Z"/>
      <!-- mane strokes -->
      <g fill="none" stroke="#2A2D32" stroke-width="0.6">
        <path d="M-4,-50 L-8,-42"/>
        <path d="M8,-54 L12,-46"/>
        <path d="M18,-50 L22,-42"/>
      </g>
    </g>
  </g>

  <!-- RIGHT PANEL : yellow, baobab -->
  <g transform="translate(360 296)">
    <path d="M0 0 L212 0 L200 120 L-12 120 Z" fill="url(#aYellow)"
          stroke="url(#aGold)" stroke-width="3"/>
    <!-- Baobab (bronze) -->
    <g transform="translate(100 60)" fill="url(#aBronze)" stroke="#3D2810" stroke-width="1.2">
      <!-- trunk -->
      <path d="M-10 38 L-8 -6 C-8 -14 8 -14 8 -6 L10 38 Z"/>
      <!-- foliage crown -->
      <ellipse cx="0"   cy="-18" rx="44" ry="16"/>
      <ellipse cx="-20" cy="-28" rx="20" ry="12"/>
      <ellipse cx="16"  cy="-30" rx="22" ry="12"/>
      <ellipse cx="-30" cy="-16" rx="12" ry="8"/>
      <ellipse cx="30"  cy="-14" rx="12" ry="8"/>
      <!-- branches hinted -->
      <g fill="none" stroke="#3D2810" stroke-width="1.2" opacity=".8">
        <path d="M-22,-10 C-16,-2 -8,0 -2,-4"/>
        <path d="M22,-10  C16,-2 8,0 2,-4"/>
      </g>
      <!-- roots -->
      <path d="M-12 38 L-20 46 L-4 42 Z"/>
      <path d="M12 38 L20 46 L4 42 Z"/>
    </g>
  </g>

  <!-- Side missiles w/ Sénégal flag -->
  <g transform="translate(128 444)">
    <rect x="0"  y="0" width="52" height="8" fill="url(#aSilver)" stroke="#20252C" stroke-width="0.6"/>
    <polygon points="0,0 -14,4 0,8" fill="url(#aSilver)" stroke="#20252C" stroke-width="0.6"/>
    <polygon points="52,0 66,4 52,8" fill="url(#aSilver)" stroke="#20252C" stroke-width="0.6"/>
    <!-- Sénégal mini-flag -->
    <g transform="translate(12 -16)">
      <rect x="0"  y="0" width="8"  height="14" fill="url(#aGreen)"/>
      <rect x="8"  y="0" width="8"  height="14" fill="url(#aYellow)"/>
      <rect x="16" y="0" width="8"  height="14" fill="url(#aRed)"/>
      <polygon points="12,3 13.2,6 16.4,6 13.8,8 14.8,11 12,9 9.2,11 10.2,8 7.6,6 10.8,6"
               fill="#1F7A3A"/>
      <rect x="0" y="14" width="0.9" height="10" fill="#3A3E46"/>
    </g>
  </g>
  <g transform="translate(520 444)">
    <rect x="0"  y="0" width="52" height="8" fill="url(#aSilver)" stroke="#20252C" stroke-width="0.6"/>
    <polygon points="0,0 -14,4 0,8" fill="url(#aSilver)" stroke="#20252C" stroke-width="0.6"/>
    <polygon points="52,0 66,4 52,8" fill="url(#aSilver)" stroke="#20252C" stroke-width="0.6"/>
    <g transform="translate(32 -16)">
      <rect x="0"  y="0" width="8"  height="14" fill="url(#aGreen)"/>
      <rect x="8"  y="0" width="8"  height="14" fill="url(#aYellow)"/>
      <rect x="16" y="0" width="8"  height="14" fill="url(#aRed)"/>
      <polygon points="12,3 13.2,6 16.4,6 13.8,8 14.8,11 12,9 9.2,11 10.2,8 7.6,6 10.8,6"
               fill="#1F7A3A"/>
      <rect x="23" y="14" width="0.9" height="10" fill="#3A3E46"/>
    </g>
  </g>

  <!-- JET (frontal, chrome) -->
  <g transform="translate(350 520)" stroke="#181B20" stroke-width="1">
    <!-- wings swept -->
    <path d="M-30,-40 L-220,60 L-220,86 L-30,24 Z" fill="url(#aSilver)"/>
    <path d="M30,-40 L220,60 L220,86 L30,24 Z" fill="url(#aSilver)"/>
    <!-- fuselage -->
    <path d="M0,-190
             L20,-130 L28,-50 L38,40 L34,112 L-34,112 L-38,40 L-28,-50 L-20,-130 Z"
          fill="url(#aSilver)"/>
    <!-- canopy -->
    <ellipse cx="0" cy="-80" rx="10" ry="32" fill="#0E1216"/>
    <!-- engine intakes -->
    <path d="M-30,0 L-18,50 L-10,10 Z" fill="#0E1216"/>
    <path d="M30,0 L18,50 L10,10 Z" fill="#0E1216"/>
    <!-- vertical tails (twin) -->
    <path d="M-18,40 L-50,110 L-28,110 L-12,60 Z" fill="url(#aSilver)"/>
    <path d="M18,40 L50,110 L28,110 L12,60 Z" fill="url(#aSilver)"/>
    <!-- exhaust nozzles -->
    <ellipse cx="-16" cy="112" rx="10" ry="4" fill="#0E1216"/>
    <ellipse cx="16"  cy="112" rx="10" ry="4" fill="#0E1216"/>
    <!-- nose highlight -->
    <path d="M-3,-186 L3,-186 L1.4,-160 L-1.4,-160 Z" fill="#FFFFFF" opacity=".7"/>
    <!-- fuselage panel line -->
    <path d="M0,-186 L0,100" stroke="#262A32" stroke-width="0.6" fill="none" opacity=".7"/>
  </g>

  <!-- Bottom stripes (green, yellow, red) diagonally outward -->
  <g transform="translate(350 720)">
    <path d="M-210,0 C-130,-8 -60,-10 0,-10 C60,-10 130,-8 210,0
             L220,20 L-220,20 Z" fill="url(#aGreen)" stroke="url(#aGold)" stroke-width="1.2"/>
    <path d="M-218,24 C-132,16 -64,14 0,14 C64,14 132,16 218,24
             L228,44 L-228,44 Z" fill="url(#aYellow)" stroke="url(#aGold)" stroke-width="1.2"/>
    <path d="M-228,48 C-136,40 -66,38 0,38 C66,38 136,40 228,48
             L240,68 L-240,68 Z" fill="url(#aRed)" stroke="url(#aGold)" stroke-width="1.2"/>
  </g>

  <!-- Lower badge with green star -->
  <g transform="translate(350 820)">
    <path d="M-44,-12 L44,-12 L38,24 L0,38 L-38,24 Z"
          fill="url(#aGold)" stroke="#5C3F0E" stroke-width="1.5"/>
    <polygon points="0,-2 4.4,8 15.4,8 6.6,14.6 10,25.4 0,19 -10,25.4 -6.6,14.6 -15.4,8 -4.4,8"
             fill="#1F7A3A" stroke="#103A1D" stroke-width="0.6"/>
    <!-- small wing flanks -->
    <path d="M-60,-8 L-44,-12 L-44,-4 Z" fill="url(#aGold)" stroke="#5C3F0E" stroke-width="1"/>
    <path d="M60,-8 L44,-12 L44,-4 Z"   fill="url(#aGold)" stroke="#5C3F0E" stroke-width="1"/>
  </g>
</svg>
