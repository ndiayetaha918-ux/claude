<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 720" fill="none">
  <defs>
    <linearGradient id="bShield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#A9CCDD"/>
      <stop offset="0.55" stop-color="#5F94AE"/>
      <stop offset="1"   stop-color="#3B6D86"/>
    </linearGradient>
    <linearGradient id="bGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#F5D58A"/>
      <stop offset="0.55" stop-color="#B48028"/>
      <stop offset="1"   stop-color="#7B5414"/>
    </linearGradient>
    <radialGradient id="bGloss" cx="0.3" cy="0.25" r="0.85">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".45"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bCloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".9"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".5"/>
    </linearGradient>
  </defs>

  <!-- Shield -->
  <path d="M70 80 H530 V430 C530 560 420 660 300 700 C180 660 70 560 70 430 Z"
        fill="url(#bShield)" stroke="url(#bGold)" stroke-width="10"/>
  <path d="M70 80 H530 V430 C530 560 420 660 300 700 C180 660 70 560 70 430 Z"
        fill="url(#bGloss)"/>

  <!-- Top band -->
  <path d="M70 80 H530 V140 H70 Z" fill="url(#bGold)" opacity=".92"/>
  <text x="300" y="124" text-anchor="middle"
        font-family="'Cormorant Garamond','Times New Roman',serif"
        font-weight="800" font-size="40" fill="#2A1E08" letter-spacing="8">RÉPUBLIQUE DU SÉNÉGAL</text>

  <!-- Star rayed -->
  <g transform="translate(300 340)">
    <g fill="none" stroke="url(#bGold)" stroke-width="2.5" opacity=".75">
      <line x1="0" y1="-150" x2="0" y2="-210"/>
      <line x1="0" y1="150"  x2="0" y2="210"/>
      <line x1="-150" y1="0" x2="-210" y2="0"/>
      <line x1="150"  y1="0" x2="210"  y2="0"/>
      <line x1="-106" y1="-106" x2="-150" y2="-150"/>
      <line x1="106"  y1="-106" x2="150"  y2="-150"/>
      <line x1="-106" y1="106"  x2="-150" y2="150"/>
      <line x1="106"  y1="106"  x2="150"  y2="150"/>
    </g>
    <polygon points="0,-140 40,-44 144,-44 60,18 92,114 0,56 -92,114 -60,18 -144,-44 -40,-44"
             fill="url(#bGold)" stroke="#5D3F0D" stroke-width="2"/>
  </g>

  <!-- Eagle silhouette (classic) -->
  <g transform="translate(300 330)" fill="url(#bGold)" stroke="#5D3F0D" stroke-width="1.5">
    <!-- wings -->
    <path d="M0,0
             C-30,-10 -60,-22 -100,-28
             C-150,-34 -210,-28 -250,-12
             C-210,-4 -170,4 -140,10
             C-110,16 -80,22 -40,28
             C-20,32 -6,38 0,44
             C6,38 20,32 40,28
             C80,22 110,16 140,10
             C170,4 210,-4 250,-12
             C210,-28 150,-34 100,-28
             C60,-22 30,-10 0,0 Z"/>
    <!-- body -->
    <ellipse cx="0" cy="16" rx="16" ry="30"/>
    <!-- head -->
    <path d="M-6,-10 C-2,-22 2,-22 6,-10 L4,2 L-4,2 Z"/>
    <!-- tail -->
    <path d="M-10,46 L-16,86 L-4,76 L0,96 L4,76 L16,86 L10,46 Z"/>
  </g>

  <!-- Clouds below eagle -->
  <g fill="url(#bCloud)" opacity=".85">
    <ellipse cx="180" cy="500" rx="60" ry="16"/>
    <ellipse cx="250" cy="510" rx="75" ry="14"/>
    <ellipse cx="340" cy="512" rx="80" ry="15"/>
    <ellipse cx="420" cy="502" rx="60" ry="14"/>
  </g>

  <!-- Ribbon bottom -->
  <g>
    <path d="M120 580 L480 580 L500 615 L100 615 Z" fill="url(#bGold)" stroke="#5D3F0D" stroke-width="2"/>
    <text x="300" y="606" text-anchor="middle"
          font-family="'Cormorant Garamond','Times New Roman',serif"
          font-weight="800" font-size="28" fill="#2A1E08" letter-spacing="6">ARMÉE DE L'AIR</text>
  </g>

  <!-- Corner laurels -->
  <g transform="translate(120 420)" fill="url(#bGold)" opacity=".9">
    <path d="M0,0 C10,-10 26,-16 40,-12 C30,-4 18,6 6,14 Z"/>
    <path d="M10,20 C20,10 36,4 50,8 C40,16 28,26 16,34 Z"/>
    <path d="M20,44 C30,34 46,28 60,32 C50,40 38,50 26,58 Z"/>
  </g>
  <g transform="translate(480 420) scale(-1 1)" fill="url(#bGold)" opacity=".9">
    <path d="M0,0 C10,-10 26,-16 40,-12 C30,-4 18,6 6,14 Z"/>
    <path d="M10,20 C20,10 36,4 50,8 C40,16 28,26 16,34 Z"/>
    <path d="M20,44 C30,34 46,28 60,32 C50,40 38,50 26,58 Z"/>
  </g>
</svg>
