<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 780" fill="none">
  <defs>
    <linearGradient id="bSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#B4D8E9"/>
      <stop offset="0.55" stop-color="#7FB6CF"/>
      <stop offset="1"    stop-color="#5991AD"/>
    </linearGradient>
    <linearGradient id="bGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#F9E2A4"/>
      <stop offset="0.25" stop-color="#E6BE5E"/>
      <stop offset="0.55" stop-color="#B88832"/>
      <stop offset="1"    stop-color="#7A5816"/>
    </linearGradient>
    <linearGradient id="bGoldSoft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#FFEFBF"/>
      <stop offset="0.5"  stop-color="#D6A547"/>
      <stop offset="1"    stop-color="#8B6220"/>
    </linearGradient>
    <radialGradient id="bGloss" cx="0.35" cy="0.25" r="0.85">
      <stop offset="0"   stop-color="#FFFFFF" stop-opacity=".55"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="bEmboss" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feSpecularLighting in="b" surfaceScale="2" specularConstant="0.9"
                          specularExponent="18" lighting-color="#FFF6D6" result="s">
        <feDistantLight azimuth="225" elevation="55"/>
      </feSpecularLighting>
      <feComposite in="s" in2="SourceGraphic" operator="in" result="sc"/>
      <feComposite in="SourceGraphic" in2="sc" operator="arithmetic"
                   k1="0" k2="1" k3="1" k4="0"/>
    </filter>
  </defs>

  <!-- Outer gold frame -->
  <path d="M80 70 H620 V460 C620 600 500 700 350 748 C200 700 80 600 80 460 Z"
        fill="url(#bGold)"/>

  <!-- Inner shield field -->
  <path d="M100 92 H600 V456 C600 586 490 678 350 722 C210 678 100 586 100 456 Z"
        fill="url(#bSky)"/>
  <path d="M100 92 H600 V456 C600 586 490 678 350 722 C210 678 100 586 100 456 Z"
        fill="url(#bGloss)"/>

  <!-- Thin inner gold line -->
  <path d="M112 102 H588 V454 C588 578 484 664 350 706 C216 664 112 578 112 454 Z"
        fill="none" stroke="url(#bGoldSoft)" stroke-width="3" opacity=".9"/>

  <!-- Top: SENEGAL -->
  <text x="350" y="170" text-anchor="middle"
        font-family="'Cinzel','Trajan Pro','Cormorant Garamond',serif"
        font-weight="800" font-size="56" fill="url(#bGold)"
        letter-spacing="16" stroke="#6A4A12" stroke-width="1">SENEGAL</text>

  <!-- Central 5-point star (outline, large) -->
  <g transform="translate(350 430)" fill="none" stroke="url(#bGold)" stroke-width="4" opacity=".92">
    <polygon points="0,-250 59,-77 241,-77 94,31 150,204 0,100 -150,204 -94,31 -241,-77 -59,-77"/>
    <polygon points="0,-250 59,-77 241,-77 94,31 150,204 0,100 -150,204 -94,31 -241,-77 -59,-77"
             stroke="#6A4A12" stroke-width="1.5"/>
  </g>

  <!-- Eagle (wings spread, diving) -->
  <g transform="translate(350 380)" fill="url(#bGold)" stroke="#5D3F0D" stroke-width="1.2">
    <!-- left wing -->
    <path d="M-10,-10
             C-50,-28 -110,-40 -180,-36
             C-230,-32 -270,-18 -288,-2
             C-250,-8 -214,-8 -180,-2
             C-140,6 -110,14 -86,24
             C-62,34 -40,44 -20,48
             C-10,50 -6,46 -8,40
             Z"/>
    <!-- feather lines left -->
    <g stroke="#A07020" stroke-width="0.8" fill="none" opacity=".9">
      <path d="M-60,0 C-90,-4 -130,-10 -180,-12"/>
      <path d="M-50,10 C-80,8 -120,6 -180,2"/>
      <path d="M-40,20 C-70,20 -110,22 -160,26"/>
    </g>
    <!-- right wing -->
    <path d="M10,-10
             C50,-28 110,-40 180,-36
             C230,-32 270,-18 288,-2
             C250,-8 214,-8 180,-2
             C140,6 110,14 86,24
             C62,34 40,44 20,48
             C10,50 6,46 8,40
             Z"/>
    <g stroke="#A07020" stroke-width="0.8" fill="none" opacity=".9">
      <path d="M60,0 C90,-4 130,-10 180,-12"/>
      <path d="M50,10 C80,8 120,6 180,2"/>
      <path d="M40,20 C70,20 110,22 160,26"/>
    </g>
    <!-- body -->
    <path d="M-14,0 C-10,-10 -4,-18 0,-20 C4,-18 10,-10 14,0
             C18,20 16,44 8,62 C4,72 -4,72 -8,62
             C-16,44 -18,20 -14,0 Z"/>
    <!-- head/beak -->
    <path d="M14,-4 C24,-8 36,-6 44,0 L36,6 L22,8 Z"/>
    <circle cx="28" cy="-2" r="1.6" fill="#2A1E08"/>
    <!-- tail feathers -->
    <path d="M-6,60 L-14,96 L-4,86 L0,104 L4,86 L14,96 L6,60 Z"/>
    <!-- legs/talons -->
    <path d="M-4,62 L-10,78 L-6,78 L-8,84 M-6,62 L-2,80 L0,76 L2,82
             M4,62 L10,78 L6,78 L8,84" stroke="#5D3F0D" stroke-width="1.6" fill="none"/>
  </g>

  <!-- Bottom: ARMÉE DE L'AIR (two lines) -->
  <text x="350" y="580" text-anchor="middle"
        font-family="'Cinzel','Trajan Pro','Cormorant Garamond',serif"
        font-weight="800" font-size="40" fill="url(#bGold)"
        letter-spacing="6" stroke="#6A4A12" stroke-width="0.8">ARMÉE</text>
  <text x="350" y="628" text-anchor="middle"
        font-family="'Cinzel','Trajan Pro','Cormorant Garamond',serif"
        font-weight="800" font-size="40" fill="url(#bGold)"
        letter-spacing="6" stroke="#6A4A12" stroke-width="0.8">DE L'AIR</text>
</svg>
