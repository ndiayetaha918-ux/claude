<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" fill="none">
  <defs>
    <linearGradient id="shieldBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ECDE3"/>
      <stop offset="0.55" stop-color="#7FB6CF"/>
      <stop offset="1" stop-color="#5E96B0"/>
    </linearGradient>
    <linearGradient id="goldOld" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5D78A"/>
      <stop offset="0.5" stop-color="#C99238"/>
      <stop offset="1" stop-color="#8E6219"/>
    </linearGradient>
    <radialGradient id="shieldGloss" cx="0.35" cy="0.25" r="0.8">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".55"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Shield outline -->
  <path d="M60 70 H540 V420 C540 540 420 640 300 670 C180 640 60 540 60 420 Z"
        fill="url(#shieldBlue)" stroke="url(#goldOld)" stroke-width="10"/>
  <path d="M60 70 H540 V420 C540 540 420 640 300 670 C180 640 60 540 60 420 Z"
        fill="url(#shieldGloss)"/>
  <!-- Star -->
  <g transform="translate(300 360)" fill="none" stroke="url(#goldOld)" stroke-width="6">
    <polygon points="0,-180 53,-56 184,-56 78,22 119,148 0,72 -119,148 -78,22 -184,-56 -53,-56"/>
  </g>
  <!-- Eagle silhouette -->
  <g transform="translate(300 320)" fill="url(#goldOld)">
    <path d="M0,0
             C-30,-10 -55,-25 -90,-30
             C-130,-35 -180,-30 -230,-15
             C-180,-5 -140,5 -110,15
             C-80,25 -50,35 -25,40
             C-10,45 0,50 0,55
             C0,50 10,45 25,40
             C50,35 80,25 110,15
             C140,5 180,-5 230,-15
             C180,-30 130,-35 90,-30
             C55,-25 30,-10 0,0 Z"/>
    <ellipse cx="0" cy="20" rx="18" ry="35"/>
    <path d="M-8,55 L-12,90 L-3,80 L0,95 L3,80 L12,90 L8,55 Z"/>
  </g>
  <!-- Top text SENEGAL -->
  <text x="300" y="135" text-anchor="middle"
        font-family="'Cormorant Garamond','Times New Roman',serif"
        font-weight="700" font-size="48" fill="url(#goldOld)" letter-spacing="6">SENEGAL</text>
  <!-- Bottom text -->
  <text x="300" y="555" text-anchor="middle"
        font-family="'Cormorant Garamond','Times New Roman',serif"
        font-weight="700" font-size="38" fill="url(#goldOld)" letter-spacing="4">ARMÉE</text>
  <text x="300" y="600" text-anchor="middle"
        font-family="'Cormorant Garamond','Times New Roman',serif"
        font-weight="700" font-size="38" fill="url(#goldOld)" letter-spacing="4">DE L'AIR</text>
</svg>
