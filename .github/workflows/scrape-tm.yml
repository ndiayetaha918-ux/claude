name: Sync Transfermarkt values

# Synchronisation automatique des valeurs joueurs depuis Transfermarkt.
# Tourne 2× par semaine (lundi + jeudi à 6h UTC) ou manuellement.
on:
  # Auto : tourne quand le scraper ou ce workflow changent sur la branche app
  # (le cron seul tournait sur la branche par défaut, qui n'a pas l'app →
  # les valeurs n'étaient JAMAIS synchronisées).
  push:
    branches:
      - claude/drafter-football-app-ZhrSH
    paths:
      - tools/scrape-tm.js
      - .github/workflows/scrape-tm.yml
  schedule:
    - cron: '0 6 * * 1,4'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode (check / update200 / updateAll)'
        required: true
        default: 'update200'
        type: choice
        options:
          - check
          - update200
          - updateAll

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          # le cron part de la branche par défaut → forcer la branche app
          ref: claude/drafter-football-app-ZhrSH

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run scraper
        run: |
          MODE="${{ github.event.inputs.mode }}"
          # push → top 800 (couvre toute l'économie draftable, tient dans le
          # timeout) ; cron → top 200 ; dispatch → choix manuel.
          if [ -z "$MODE" ]; then
            if [ "${{ github.event_name }}" = "push" ]; then MODE="update800"; else MODE="update200"; fi
          fi
          if [ "$MODE" = "check" ]; then
            node tools/scrape-tm.js --check
          elif [ "$MODE" = "updateAll" ]; then
            node tools/scrape-tm.js --all
          elif [ "$MODE" = "update800" ]; then
            node tools/scrape-tm.js --limit 800
          else
            node tools/scrape-tm.js --limit 200
          fi

      - name: Commit changes
        if: github.event.inputs.mode != 'check'
        run: |
          git config user.name 'drafter-bot'
          git config user.email 'bot@drafter'
          if git diff --quiet scripts/players.js; then
            echo "No changes."
            exit 0
          fi
          git add scripts/players.js
          git commit -m "chore(data): sync TM values $(date -u +%Y-%m-%d)"
          git push
